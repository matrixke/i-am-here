name: Natural Contributions

on:
  schedule:
    # Runs at a random-ish time (e.g., 07:45 UTC) to avoid "exact hour" patterns
    - cron: '45 7 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Natural Activity
        run: |
          # 1. Randomly decide if we should skip today (20% chance of no activity)
          if [ $(( RANDOM % 10 )) -lt 2 ]; then
            echo "Taking a break today. No commits."
            exit 0
          fi

          # 2. Randomize the number of commits (between 1 and 12)
          # This creates different shades of green
          COMMIT_COUNT=$(( 1 + RANDOM % 12 ))
          echo "Planning $COMMIT_COUNT commits for today."

          git config --local user.name "matrixke"
          git config --local user.email "bosirebrian718@gmail.com"

          for i in $(seq 1 $COMMIT_COUNT)
          do
            # 3. Add a small sleep between commits so timestamps aren't identical
            sleep $(( RANDOM % 5 ))
            echo "$(date -u) - Activity Log: $RANDOM" >> activity.log
            git add activity.log
            git commit -m "refactor: update activity logs"
          done

      - name: Push changes
        run: git push
